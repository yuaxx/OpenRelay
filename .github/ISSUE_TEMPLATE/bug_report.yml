name: Bug report
description: Report a defect in the OpenRelay proxy, CLI, dashboard, provider adapter, or packaging.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in OpenRelay. Include a minimal reproduction and exact environment details.
        **Warning**: Do not include secrets, API keys, OAuth session tokens, cookies, emails, or personal identifiers.

  - type: dropdown
    id: client
    attributes:
      label: Client or integration
      description: Which client or surface did you observe the problem in?
      options:
        - Codex CLI
        - Codex App
        - Codex SDK
        - Claude Code
        - Direct HTTP/API client
        - OpenRelay dashboard
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of OpenRelay is affected?
      options:
        - CLI
        - Proxy and routing
        - Dashboard
        - Provider adapter
        - Authentication and account pool
        - Catalog / models
        - RTK output compression
        - Streaming
        - Tools / MCP / web search
        - Installation or packaging
        - Service lifecycle
        - Platform (Windows / macOS / Linux)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: The proxy returns 502 when ...; I expected ...
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command executed
      description: Exact CLI command or request executed (e.g. orl start, orl doctor, curl).
      placeholder: "orl start --port 10100"

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Exact commands, steps, configuration shape, and inputs. If the problem is intermittent or not yet consistently reproducible, explain what you have observed and under which conditions.
      placeholder: |
        1. orl start --port 10100
        2. Send a request to /v1/responses with ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenRelay version
      description: Installed OpenRelay version (`orl --version`) or commit SHA.
      placeholder: "2.82.0"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Version of Bun (`bun --version`).
      placeholder: "1.4.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS name and version.
      placeholder: Windows 11 24H2, macOS 15.5, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: Provider and model
      description: Required only when the problem is provider-specific.
      placeholder: "anthropic / claude-sonnet-4-20250514"

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant logs, stack traces, or request IDs.
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and supporting files
      description: Drag screenshots, videos, logs, or minimal reproduction archives here.

  - type: textarea
    id: config
    attributes:
      label: Redacted configuration
      description: Share a redacted config snippet if the bug depends on provider or routing setup.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed secrets, tokens, cookies, passwords, account details, request credentials, and personal data.
          required: true
